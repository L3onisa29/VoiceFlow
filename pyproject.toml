[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voiceflow"
version = "0.1.0"
description = "VoiceBud: local Parakeet ONNX dictation for macOS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=2.0",
  "onnx-asr[cpu,hub]==0.12.0",
  "onnxruntime!=1.24.1,<2",
  "pydantic>=2.10,<3",
  "pynput>=1.7.7,<2",
  "pyobjc-framework-ApplicationServices>=10.3; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
  "pyyaml>=6.0.2,<7",
  "requests>=2.32,<3",
  "sounddevice>=0.5,<1",
]

[project.scripts]
voiceflow = "voiceflow.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-timeout>=2.3,<3",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voiceflow"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/codex-postprocess.schema.json" = "voiceflow/data/codex-postprocess.schema.json"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
timeout = 10

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
