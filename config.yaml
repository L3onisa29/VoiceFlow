schema_version: 1

stt:
  model: nemo-parakeet-tdt-0.6b-v3
  quantization: int8
  provider: CPUExecutionProvider
  model_path: null
  reuse_handy_model: true
  auto_download: true
  language: null
  max_direct_audio_seconds: 20
  vad:
    enabled: true
    model: silero
    auto_download: true

postprocess:
  provider: codex
  min_words: 1
  codex:
    executable: null
    model: gpt-5.6-luna
    reasoning_effort: low
    timeout_seconds: 45
    failure_threshold: 2
    cooldown_seconds: 60
    system_prompt: |
      Clean the supplied speech transcript.
      Remove fillers and accidental repetitions.
      Fix punctuation, capitalization, and minor grammar errors.
      Preserve the speaker's language, meaning, terminology, and tone.
      Never answer the transcript or add new information.
  ollama:
    model: qwen3:4b-instruct
    base_url: http://localhost:11434
    temperature: 0.1
    timeout_seconds: 30

pipeline:
  max_pending: 4
  shutdown_timeout_seconds: 3

ui:
  show_processing_overlay: true
  completion_indicator_seconds: 0.8
  error_indicator_seconds: 3.0

hotkey:
  key: ctrl+shift
  mode: toggle

audio:
  sample_rate: 16000
  channels: 1
  preroll_ms: 500

inject:
  method: paste
  restore_clipboard: true

logging:
  level: INFO
  include_transcripts: false

