schema_version: 3

stt:
  model: nemo-parakeet-tdt-0.6b-v3
  quantization: int8
  provider: CPUExecutionProvider
  model_path: null
  reuse_handy_model: true
  auto_download: true
  language: null
  max_direct_audio_seconds: 20
  vad:
    enabled: true
    model: silero
    auto_download: true

postprocess:
  provider: codex
  min_words: 1
  system_prompt: |
    Edit the supplied speech transcript into the speaker's final intended statement.
    Produce polished written prose, not a lightly punctuated verbatim transcript.
    Apply a conservative editing policy: when abandonment or finality is ambiguous,
    preserve the original meaning and uncertainty.

    Remove:
    - fillers and verbal hesitation with no semantic value;
    - accidental repetitions of words, phrases, clauses, and sentence fragments;
    - sentence starts that the speaker explicitly interrupts, replaces, or abandons;
    - alternatives explicitly rejected or replaced by the speaker;
    - intermediate deliberation only when the speaker clearly commits to a final decision.

    Repair transcription artifacts throughout the result:
    - join fragments that clearly form one sentence and split run-on sentences;
    - correct grammar, syntax, agreement, articles, and prepositions;
    - make capitalization and punctuation consistent with normal written language;
    - remove duplicated connectors and repeated content while preserving intentional emphasis.

    For explicit self-corrections, keep only the final replacement and remove the
    abandoned version.

    Treat a decision as resolved only when the transcript contains a clear final
    commitment, selection, rejection, or replacement. A later mention of an option
    is not by itself evidence that the other options were abandoned.

    If the speaker leaves a matter unresolved:
    - do not infer, select, or recommend a conclusion;
    - preserve the remaining alternatives;
    - preserve the speaker's uncertainty, conditions, reservations, and open questions.

    If the transcript contains multiple independent decisions, evaluate each one
    separately. Resolve only those with a clear conclusion and preserve the
    uncertainty of the others.

    Preserve explanations and reasoning that still support, constrain, qualify, or
    justify the final position. Remove reasoning only when it belongs exclusively
    to an explicitly abandoned alternative.

    For complex instructions and reasoning, preserve every distinct requirement, step,
    dependency, condition, causal link, example, conclusion, and unresolved question.
    Improve coherence locally without summarizing or flattening the reasoning structure.

    Do not summarize, merge, or remove independent information.
    Preserve the speaker's language, intent, terminology, tone, facts, commitments,
    negations, quantities, dates, names, and level of certainty.

    Never answer the transcript and never add new information.
  routing:
    mode: auto
    rules_only_max_words: 12
  codex:
    executable: null
    model: gpt-5.6-luna
    reasoning_effort: medium
    timeout_seconds: 45
    failure_threshold: 2
    cooldown_seconds: 60
    validate_model_on_startup: false
  ollama:
    model: qwen3:4b-instruct
    base_url: http://localhost:11434
    temperature: 0.1
    timeout_seconds: 30

pipeline:
  max_pending: 4
  shutdown_timeout_seconds: 3
  injection_timeout_seconds: 2

formatting:
  spoken_punctuation: true
  explicit_lists: true
  structured_tokens: true
  backtrack: true

storage:
  database_path: ~/Library/Application Support/VoiceFlow/voicebud.sqlite3

dictionary:
  enabled: true

history:
  enabled: false
  retention_hours: 24
  max_entries: 100
  store_app_bundle_id: false

feedback:
  recent_audio_seconds: 300
  benchmark_directory: ~/Library/Application Support/VoiceFlow/benchmark-corpus

ui:
  show_processing_overlay: true
  completion_indicator_seconds: 0.8
  error_indicator_seconds: 3.0

hotkey:
  key: alt+space
  cancel_key: ctrl+space
  mode: toggle

audio:
  sample_rate: 16000
  channels: 1
  device: MacBook Pro Microphone
  minimum_recording_ms: 150
  silence_rms_threshold: 0.001
  maximum_recording_seconds: 120

inject:
  method: paste
  clipboard_clear_after_seconds: 60

logging:
  level: INFO
  file: ~/Library/Logs/VoiceBud/voicebud.log
  max_bytes: 5242880
  backup_count: 3
