schema_version: 2

stt:
  model: nemo-parakeet-tdt-0.6b-v3
  quantization: int8
  provider: CPUExecutionProvider
  model_path: null
  reuse_handy_model: true
  auto_download: true
  language: null
  max_direct_audio_seconds: 20
  vad:
    enabled: true
    model: silero
    auto_download: true

postprocess:
  provider: codex
  min_words: 1
  system_prompt: |
    Clean the supplied speech transcript.
    Remove fillers and accidental repetitions.
    Fix punctuation, capitalization, and minor grammar errors.
    Preserve the speaker's language, meaning, terminology, and tone.
    Never answer the transcript or add new information.
  codex:
    executable: null
    model: gpt-5.6-luna
    reasoning_effort: low
    timeout_seconds: 45
    failure_threshold: 2
    cooldown_seconds: 60
    validate_model_on_startup: false
  ollama:
    model: qwen3:4b-instruct
    base_url: http://localhost:11434
    temperature: 0.1
    timeout_seconds: 30

pipeline:
  max_pending: 4
  shutdown_timeout_seconds: 3
  injection_timeout_seconds: 2

ui:
  show_processing_overlay: true
  completion_indicator_seconds: 0.8
  error_indicator_seconds: 3.0

hotkey:
  key: alt+space
  mode: toggle

audio:
  sample_rate: 16000
  channels: 1
  device: MacBook Pro Microphone
  minimum_recording_ms: 150
  silence_rms_threshold: 0.001
  maximum_recording_seconds: 120

inject:
  method: paste
  clipboard_clear_after_seconds: 60

logging:
  level: INFO
  file: ~/Library/Logs/VoiceBud/voicebud.log
  max_bytes: 5242880
  backup_count: 3
