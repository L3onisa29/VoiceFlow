name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.12"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv lock --check
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest

