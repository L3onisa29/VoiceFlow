[package]
name = "voiceflow-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Local streaming dictation for macOS"
default-run = "voiceflow-desktop"

[lib]
name = "voiceflow_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
voiceflow-core = { path = "../../../crates/voiceflow-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
cpal = "0.16"
crossbeam-channel = "0.5"
arboard = { version = "3", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
libc = "0.2"
chrono = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSObject", "NSArray", "NSTimer", "NSDate", "block2"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSWorkspace", "NSRunningApplication", "NSPanel", "NSWindow", "NSView", "NSResponder", "NSControl", "NSCell", "NSButton", "NSButtonCell", "NSTextField", "NSTextFieldCell", "NSFont", "NSFontDescriptor", "libc", "objc2-core-foundation", "NSColor", "NSBezierPath", "NSGraphics", "NSScreen", "NSEvent", "NSAppearance", "NSAccessibilityProtocols"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
block2 = "0.6"
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["elcapitan"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware"] }
